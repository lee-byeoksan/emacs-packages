<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EAM Remote</title><link rel="stylesheet" href="/xterm.css"><link rel="stylesheet" href="/style.css"><body>
<header><strong>EAM <span>REMOTE · PROTOTYPE</span></strong><output id="latency"></output></header>
<p id="status" role="status">PC의 세션을 이어서 작업하세요.</p>
<section id="login"><label>접속 토큰 <input id="token" type="password" autocomplete="off"></label><button id="loginButton">접속</button></section>
<main id="home" hidden><div class="heading"><h2>실행 중인 세션</h2><button id="refresh">새로고침</button></div><div id="sessions"></div>
<details><summary>새 세션 시작</summary><h3>실행 디렉터리</h3><p id="path"></p><button id="parent">상위 폴더</button><div id="folders"></div><div class="row"><input id="folderName" aria-label="새 폴더 이름" placeholder="새 폴더 이름"><button id="mkdir">폴더 생성</button></div><div class="row"><select id="provider" aria-label="Provider"><option>Claude</option><option>Codex</option></select><button id="start">이 폴더에서 시작</button></div></details></main>
<section id="workspace" hidden><div class="heading"><span id="sessionName"></span><button id="detach">PC로 돌려주기</button></div><p id="notice">연결 중…</p><div id="terminal"></div><div id="keys" class="row"><button data-key="enter">Enter</button><button data-key="escape">Esc</button><button data-key="tab">Tab</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button><button data-key="interrupt">Ctrl-C</button></div><textarea id="composer" aria-label="요청 입력" placeholder="한글·긴 요청을 작성한 뒤 터미널에 넣으세요. Enter로 실행합니다."></textarea><button id="paste">터미널에 넣기</button></section>
<script src="/xterm.js"></script><script src="/fit.js"></script><script src="/app.js"></script></body></html>
