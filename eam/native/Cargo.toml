[package]
name = "eam-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"

[profile.release]
lto = "thin"
strip = true
